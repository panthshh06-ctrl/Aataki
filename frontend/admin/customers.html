<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | Aataki Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Aataki</h2>
                <button class="close-sidebar" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
            </div>
        </aside>
        
        <div class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                    <div class="breadcrumbs"><span>Admin / </span><strong>Customers</strong></div>
                </div>
                <div class="topbar-right">
                    <button onclick="toggleTheme()" class="icon-btn theme-toggle"><i class="fas fa-moon"></i></button>
                    <div class="admin-profile">
                        <span id="admin-name">Loading...</span>
                        <button onclick="logout()" class="icon-btn"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </header>
            
            <main class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Customer Management</h1>
                </div>
                <div class="card">
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Orders</th><th>Total Spent</th><th>Action</th></tr>
                            </thead>
                            <tbody id="customers-tbody">
                                <tr><td colspan="7">Loading customers...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/admin/js/admin.js"></script>
    <script>
        async function loadCustomers() {
            try {
                const res = await api('GET', '/customers');
                const tbody = document.getElementById('customers-tbody');
                if (!res.data || res.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7">No customers found.</td></tr>';
                    return;
                }
                tbody.innerHTML = res.data.map(c => `
                    <tr>
                        <td>${c.id}</td>
                        <td>${c.name}</td>
                        <td>${c.email || 'N/A'}</td>
                        <td>${c.phone || 'N/A'}</td>
                        <td>${c.order_count || 0}</td>
                        <td>${formatCurrency(c.total_spent || 0)}</td><td><button class="btn btn-secondary btn-sm" onclick="toggleCustomer(${c.id}, ${c.is_active ? 0 : 1})">${c.is_active ? 'Deactivate' : 'Activate'}</button></td>
                    </tr>
                `).join('');
            } catch (e) {
                document.getElementById('customers-tbody').innerHTML = '<tr><td colspan="7">Failed to load customers.</td></tr>';
                showToast(e.message, 'error');
            }
        }
        async function toggleCustomer(id, is_active) { try { await api('PUT', `/customers/${id}`, { is_active }); showToast('Customer updated.', 'success'); await loadCustomers(); } catch (error) { showToast(error.message, 'error'); } }
        document.addEventListener('DOMContentLoaded', loadCustomers);
    </script>
</body>
</html>
